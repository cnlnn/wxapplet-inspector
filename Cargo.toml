[package]
name = "wxapplet-inspector"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lucide-icons = "1.28"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
